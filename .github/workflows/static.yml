# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html styles.css script.js robots.txt sitemap.xml _site/
          cp -R assets _site/assets
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/assets/favicon.svg
          test -f _site/assets/og-mtid.png
          test -f _site/assets/mtid-overview.png
          test -f _site/assets/mtid-overview.webp
          test -f _site/assets/fonts/AtkinsonHyperlegible-Regular.woff2
          test -f _site/assets/fonts/CrimsonPro-Variable.woff2
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
